<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EAF7FC">
<title>Trackstar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
  // Muss vor dem Spotify-Skript stehen: wird aufgerufen, sobald die Player-API geladen ist.
  window.onSpotifyIframeApiReady = function (api) {
    window.__spotifyApi = api;
    if (window.__onSpotifyApi) window.__onSpotifyApi();
  };
</script>
<script src="https://open.spotify.com/embed/iframe-api/v1" async
        onerror="window.__spotifyFailed = true; if (window.__onSpotifyApi) window.__onSpotifyApi();"></script>
<style>
  :root {
    --bg: #EAF7FC;
    --ink: #0B2545;
    --muted: #2B5C8A;
    --teal: #7DE0D0;
    --teal-dark: #3DB8A5;
    --sky: #A8DCFF;
    --sky-card: #9CC9FF;
    --sun: #FFE29A;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  header {
    width: 100%;
    max-width: 440px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 4px 6px;
  }
  .logo {
    background: var(--sun);
    border: 2.5px solid var(--ink);
    border-radius: 12px;
    padding: 4px 12px;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    transform: rotate(-3deg);
  }
  #counter {
    background: #fff;
    border: 2.5px solid var(--ink);
    border-radius: 999px;
    padding: 4px 14px;
    font-size: 14px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .hdr-right { display: flex; align-items: center; gap: 10px; }
  .gear {
    width: 40px; height: 40px; flex: none;
    border-radius: 50%;
    border: 2.5px solid var(--ink);
    background: #fff;
    color: var(--ink);
    box-shadow: 3px 3px 0 var(--ink);
    padding: 0;
  }
  .gear svg { width: 22px; height: 22px; }
  .gear:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  #toast {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 72px);
    right: 24px;
    z-index: 5;
    background: var(--ink);
    color: #fff;
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity .2s, transform .2s;
    pointer-events: none;
  }
  #toast.show { opacity: 1; transform: none; }
  /* Unsichtbarer Spotify-Player (im sichtbaren Bereich, damit der Browser ihn nicht drosselt) */
  #player-host {
    position: fixed;
    top: 0; left: 0;
    width: 300px; height: 80px;
    opacity: 0;
    pointer-events: none;
    z-index: -1;
    overflow: hidden;
  }
  .play-btn {
    width: 46cqw; height: 46cqw;
    border-radius: 50%;
    border: 3px solid var(--ink);
    background: #fff;
    color: var(--ink);
    box-shadow: 1.5cqw 1.5cqw 0 var(--ink);
    padding: 0;
  }
  .play-btn svg { width: 46%; height: 46%; }
  .play-btn .ico-pause { display: none; }
  .card.is-playing .play-btn { background: var(--ink); color: #fff; }
  .card.is-playing .play-btn .ico-play { display: none; }
  .card.is-playing .play-btn .ico-pause { display: block; }
  .play-btn:active { transform: translate(2px, 2px); }

  #stage {
    flex: 1;
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    min-height: 0;
    padding: 8px 0;
    touch-action: pan-y;
  }

  /* ---- Karte ---- */
  .card {
    --size: min(80vw, calc(100vh - 340px), 340px);
    width: max(var(--size), 210px);
    aspect-ratio: 1 / 1;
    position: relative;
    perspective: 1400px;
    cursor: pointer;
    outline: none;
    container-type: inline-size;
  }
  @supports (height: 100dvh) {
    .card { --size: min(80vw, calc(100dvh - 340px), 340px); }
  }
  .card:focus-visible .card-inner { outline: 3px solid var(--ink); outline-offset: 6px; border-radius: 26px; }
  .layer {
    position: absolute;
    inset: 0;
    border: 3px solid var(--ink);
    border-radius: 8cqw;
  }
  .layer.l1 { background: var(--l1, var(--sky)); transform: translate(3cqw, 4cqw) rotate(-7deg); }
  .layer.l2 { background: var(--l2, var(--sun)); transform: translate(3cqw, 4cqw) rotate(5deg); }

  .card-inner {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    transition: transform .6s cubic-bezier(.4, .2, .2, 1);
  }
  .card.flipped .card-inner { transform: rotateY(180deg); }
  .face {
    position: absolute;
    inset: 0;
    border: 3px solid var(--ink);
    border-radius: 8cqw;
    box-shadow: 2.5cqw 2.5cqw 0 var(--ink);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .front {
    background: var(--c, var(--teal));
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .qr-box {
    width: 64%;
    aspect-ratio: 1;
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: 5.5cqw;
    padding: 5.3cqw;
    display: flex;
  }
  .qr-box svg { width: 100%; height: 100%; display: block; }
  .badge {
    position: absolute;
    left: 5cqw;
    top: -4cqw;
    background: var(--sun);
    border: 2.5px solid var(--ink);
    border-radius: 999px;
    padding: 3px 12px;
    font-size: 13px;
    font-weight: 700;
    transform: rotate(-4deg);
  }
  .back {
    transform: rotateY(180deg);
    background: var(--c, var(--sky-card));
    display: grid;
    grid-template-rows: 1fr auto 1fr;
    justify-items: center;
    text-align: center;
    padding: 8.75cqw 7.5cqw;
  }
  .artist {
    align-self: start;
    background: #fff;
    border: 2.5px solid var(--ink);
    border-radius: 999px;
    padding: 1.8cqw 5.5cqw;
    font-size: clamp(14px, 6.2cqw, 22px);
    font-weight: 700;
    line-height: 1.2;
    max-width: 100%;
    overflow-wrap: anywhere;
  }
  .year {
    font-size: 33cqw;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -.04em;
    text-shadow: 1.25cqw 1.25cqw 0 rgba(255, 255, 255, .85);
  }
  .title {
    align-self: end;
    font-size: clamp(15px, 6.5cqw, 24px);
    font-weight: 600;
    line-height: 1.25;
    overflow-wrap: anywhere;
  }
  #hint {
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    min-height: 1.2em;
    margin-top: 14px;
  }

  /* ---- Bedienung ---- */
  #controls {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 4px 0 20px;
  }
  .row { display: flex; gap: 14px; }
  button, a.btn {
    font-family: inherit;
    color: var(--ink);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    text-decoration: none;
  }
  button svg, a.btn svg { width: 1.2em; height: 1.2em; flex: none; }
  .round {
    width: 56px; height: 56px; flex: none;
    border-radius: 50%;
    border: 2.5px solid var(--ink);
    background: #fff;
    box-shadow: 4px 4px 0 var(--ink);
  }
  .primary {
    flex: 1;
    height: 56px;
    border: 0;
    border-radius: 28px;
    background: var(--ink);
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    box-shadow: 4px 4px 0 var(--teal-dark);
  }
  .pill {
    flex: 1;
    height: 48px;
    border: 2.5px solid var(--ink);
    border-radius: 24px;
    font-size: 14px;
    font-weight: 700;
  }
  .pill.sun { background: var(--sun); }
  .pill.teal { background: var(--teal); }
  button:active, a.btn:active { transform: translate(2px, 2px); }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible, a.btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  #message { margin: auto; padding: 24px; text-align: center; max-width: 380px; line-height: 1.5; }
  #message h2 { margin-top: 0; }
  #message code { background: #fff; border: 2px solid var(--ink); padding: 1px 6px; border-radius: 6px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <header>
    <div class="logo">Trackstar</div>
    <div class="hdr-right">
      <span id="counter"></span>
      <button id="gear" class="gear" type="button" aria-label="Kartenmodus wechseln" title="Zwischen QR-Code und Play-Button wechseln">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>
  <div id="toast" role="status" aria-live="polite"></div>

  <div id="player-host" aria-hidden="true"><div id="embed"></div></div>

  <div id="stage"></div>

  <div id="message" class="hidden"></div>

  <div id="controls" class="hidden">
    <div class="row">
      <button id="prev" class="round" aria-label="Vorherige Karte">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      </button>
      <button id="next" class="primary">
        <span id="nextLabel">Nächste Karte</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
    <div class="row">
      <a id="open" class="btn pill sun" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
        In Spotify öffnen
      </a>
      <button id="shuffle" class="pill teal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
        Neu mischen
      </button>
    </div>
  </div>

<script>
  const CSV_FILE = "songs.csv";

  let songs = [];
  let deck = [];
  let pos = 0;
  let cardEl = null;
  let busy = false;

  // Kartenmodus: "play" = Play-Button, "qr" = QR-Code (Zahnrad oben rechts schaltet um)
  const MODE_KEY = "trackstar-mode";
  let mode = "play";
  try {
    const saved = localStorage.getItem(MODE_KEY);
    if (saved === "play" || saved === "qr") mode = saved;
  } catch (e) {}

  const $ = (id) => document.getElementById(id);

  // ---------- CSV ----------
  function parseCSV(text) {
    text = text.replace(/^﻿/, "");
    const firstLine = text.split(/\r?\n/, 1)[0] || "";
    const delim = (firstLine.match(/;/g) || []).length >= (firstLine.match(/,/g) || []).length ? ";" : ",";
    const rows = [];
    let row = [], cell = "", inQ = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQ) {
        if (c === '"') {
          if (text[i + 1] === '"') { cell += '"'; i++; } else inQ = false;
        } else cell += c;
      } else if (c === '"') inQ = true;
      else if (c === delim) { row.push(cell); cell = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(cell); cell = "";
        if (row.some((x) => x.trim() !== "")) rows.push(row);
        row = [];
      } else cell += c;
    }
    row.push(cell);
    if (row.some((x) => x.trim() !== "")) rows.push(row);
    return rows;
  }

  function rowsToSongs(rows) {
    if (!rows.length) return [];
    const head = rows[0].map((h) => h.trim().toLowerCase());
    const find = (...names) => head.findIndex((h) => names.includes(h));
    const iA = find("interpret", "artist", "band");
    const iT = find("titel", "title", "song");
    const iY = find("jahr", "year");
    const iL = find("spotify_link", "link", "spotify", "url");
    if ([iA, iT, iY, iL].includes(-1)) {
      throw new Error("Kopfzeile der CSV muss lauten: interpret;titel;jahr;spotify_link");
    }
    return rows.slice(1).map((r) => ({
      artist: (r[iA] || "").trim(),
      title: (r[iT] || "").trim(),
      year: (r[iY] || "").trim(),
      link: (r[iL] || "").trim(),
    })).filter((s) => s.link && s.title);
  }

  // ---------- Deck ----------
  function shuffleArray(a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ---------- Kartenfarben (wechseln pro Karte, Vorder- und Rückseite gleich) ----------
  const PALETTE = [
    "#7DE0D0", // Türkis
    "#9CC9FF", // Himmelblau
    "#FFB8CE", // Rosa
    "#FFE066", // Gelb
    "#FFAE85", // Korall
    "#CDBBFF", // Flieder
    "#C6F25A", // Limette
    "#A8F0B5", // Mint
  ];
  const colorAt = (i) => PALETTE[i % PALETTE.length];

  // ---------- QR ----------
  function qrSvg(text) {
    const qr = qrcode(0, "M");
    qr.addData(text);
    qr.make();
    const n = qr.getModuleCount();
    let path = "";
    for (let r = 0; r < n; r++) {
      for (let c = 0; c < n; c++) {
        if (qr.isDark(r, c)) path += `M${c} ${r}h1v1h-1z`;
      }
    }
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" role="img" aria-label="QR-Code zum Spotify-Lied"><path d="${path}" fill="#0B2545"/></svg>`;
  }

  // ---------- Render ----------
  function esc(s) {
    return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function renderCard() {
    stopPlayback();
    const s = deck[pos];
    $("stage").innerHTML = `
      <div class="card" tabindex="0" role="button" aria-label="Karte umdrehen"
           style="--c:${colorAt(pos)};--l1:${colorAt(pos + 1)};--l2:${colorAt(pos + 2)}">
        <div class="layer l1"></div>
        <div class="layer l2"></div>
        <div class="card-inner">
          <div class="face front">${frontHtml(s)}</div>
          <div class="face back">
            <div class="artist">${esc(s.artist)}</div>
            <div class="year">${esc(s.year)}</div>
            <div class="title">${esc(s.title)}</div>
          </div>
        </div>
      </div>
      <div id="hint">Tippen zum Umdrehen</div>`;
    cardEl = $("stage").querySelector(".card");
    cardEl.addEventListener("click", (e) => {
      if (e.target.closest(".play-btn")) { togglePlay(); return; }
      flip();
    });
    cardEl.addEventListener("keydown", (e) => {
      if (e.target !== cardEl) return; // Enter/Leertaste auf dem Play-Button löst dessen eigenen Klick aus
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); }
    });
    $("open").href = s.link;
    $("counter").textContent = `${pos + 1} / ${deck.length}`;
    $("prev").disabled = pos === 0;
    $("nextLabel").textContent = pos === deck.length - 1 ? "Neu mischen" : "Nächste Karte";
    afterRender(s);
  }

  function flip() {
    if (!cardEl) return;
    cardEl.classList.toggle("flipped");
    $("hint").textContent = cardEl.classList.contains("flipped") ? "Tippen zum Zurückdrehen" : "Tippen zum Umdrehen";
  }

  function go(delta) {
    if (busy) return;
    const target = pos + delta;
    if (target < 0) return;
    if (target >= deck.length) { reshuffle(); return; }
    busy = true;
    const wasFlipped = cardEl && cardEl.classList.contains("flipped");
    if (wasFlipped) cardEl.classList.remove("flipped");
    setTimeout(() => {
      pos = target;
      renderCard();
      busy = false;
    }, wasFlipped ? 350 : 0);
  }

  function reshuffle() {
    busy = true;
    const wasFlipped = cardEl && cardEl.classList.contains("flipped");
    if (wasFlipped) cardEl.classList.remove("flipped");
    setTimeout(() => {
      deck = shuffleArray(songs);
      pos = 0;
      renderCard();
      busy = false;
    }, wasFlipped ? 350 : 0);
  }

  // ---------- Player (Spotify-Einbett-Player, unsichtbar) ----------
  let controller = null;   // Spotify-iFrame-Controller
  let creating = false;
  let loadedUri = null;    // Track, der im Player geladen ist
  let currentUri = null;   // Track der aktuellen Karte
  let playing = false;

  function trackUri(link) {
    const m = link.match(/open\.spotify\.com\/(?:intl-[a-z-]+\/)?(?:embed\/)?track\/([A-Za-z0-9]+)/i)
           || link.match(/^spotify:track:([A-Za-z0-9]+)/i);
    return m ? "spotify:track:" + m[1] : null;
  }

  function usePlayer(s) { return mode === "play" && !!trackUri(s.link); }

  function frontHtml(s) {
    if (usePlayer(s)) {
      return `
        <button type="button" class="play-btn" aria-label="Song abspielen oder pausieren">
          <svg class="ico-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
          <svg class="ico-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg>
        </button>
        <div class="badge">Anhören!</div>`;
    }
    return `
      <div class="qr-box">${qrSvg(s.link)}</div>
      <div class="badge">Scannen!</div>`;
  }

  function setHint(text) {
    const h = $("hint");
    if (h) h.textContent = text;
  }

  function syncPlaying() {
    if (cardEl) cardEl.classList.toggle("is-playing", playing);
  }

  function stopPlayback() {
    if (controller && playing) { try { controller.pause(); } catch (e) {} }
    playing = false;
    syncPlaying();
  }

  function playerReady(api) {
    // Wird von loadTrack aufgerufen, sobald die Spotify-API da ist
    if (controller || creating || !api || !currentUri) return;
    creating = true;
    const startUri = currentUri;
    api.createController($("embed"), { uri: startUri, width: 300, height: 80 }, (c) => {
      controller = c;
      creating = false;
      loadedUri = startUri;
      c.addListener("playback_update", (e) => {
        const d = e.data || {};
        playing = !d.isPaused;
        syncPlaying();
        // Nur eine 30-Sekunden-Vorschau? Dann ist man im Browser nicht bei Spotify eingeloggt.
        if (playing && d.duration && d.duration <= 31000) {
          setHint("Nur 30-Sekunden-Vorschau – im Browser bei Spotify einloggen");
        }
      });
      if (currentUri && currentUri !== loadedUri) { c.loadUri(currentUri); loadedUri = currentUri; }
    });
  }

  function loadTrack(s) {
    const uri = trackUri(s.link);
    currentUri = uri;
    if (mode !== "play" || !uri) return;
    if (controller) {
      if (loadedUri !== uri) { controller.loadUri(uri); loadedUri = uri; }
    } else if (window.__spotifyApi) {
      playerReady(window.__spotifyApi);
    }
  }

  function afterRender(s) {
    if (mode === "play" && !trackUri(s.link)) {
      setHint("Kein Track-Link in der CSV – QR-Code stattdessen");
    }
    loadTrack(s);
  }

  function togglePlay() {
    if (!controller) {
      setHint(window.__spotifyFailed
        ? "Player nicht erreichbar – „In Spotify öffnen“ nutzen"
        : "Player lädt noch …");
      return;
    }
    controller.togglePlay();
  }

  window.__onSpotifyApi = () => { if (deck[pos]) loadTrack(deck[pos]); };
  if (window.__spotifyApi && deck[pos]) loadTrack(deck[pos]);

  // ---------- Zahnrad: Modus wechseln ----------
  let toastTimer = null;
  function showToast(text) {
    const t = $("toast");
    t.textContent = text;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
  }

  function updateGear() {
    const label = mode === "play" ? "Play-Button" : "QR-Code";
    $("gear").setAttribute("aria-label", `Kartenmodus wechseln, aktuell: ${label}`);
  }

  $("gear").addEventListener("click", () => {
    mode = mode === "play" ? "qr" : "play";
    try { localStorage.setItem(MODE_KEY, mode); } catch (e) {}
    updateGear();
    showToast(mode === "play" ? "Modus: Play-Button" : "Modus: QR-Code");
    if (!deck.length) return;
    const wasFlipped = cardEl && cardEl.classList.contains("flipped");
    renderCard();
    if (wasFlipped) { cardEl.classList.add("flipped"); setHint("Tippen zum Zurückdrehen"); }
  });
  updateGear();

  // ---------- Events ----------
  $("next").addEventListener("click", () => go(1));
  $("prev").addEventListener("click", () => go(-1));
  $("shuffle").addEventListener("click", reshuffle);

  document.addEventListener("keydown", (e) => {
    if (!deck.length) return;
    if (e.key === "ArrowRight") go(1);
    else if (e.key === "ArrowLeft") go(-1);
    else if (e.key === " " && e.target === document.body) { e.preventDefault(); flip(); }
  });

  let sx = 0, sy = 0, swiped = false;
  const stage = $("stage");
  stage.addEventListener("touchstart", (e) => {
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; swiped = false;
  }, { passive: true });
  stage.addEventListener("touchend", (e) => {
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      swiped = true;
      go(dx < 0 ? 1 : -1);
    }
  }, { passive: true });
  // Wischen soll die Karte nicht zusätzlich umdrehen
  stage.addEventListener("click", (e) => {
    if (swiped) { e.stopPropagation(); e.preventDefault(); swiped = false; }
  }, true);

  // ---------- Start ----------
  function showMessage(html) {
    $("stage").classList.add("hidden");
    $("controls").classList.add("hidden");
    $("message").classList.remove("hidden");
    $("message").innerHTML = html;
  }

  async function init() {
    try {
      const res = await fetch(CSV_FILE + "?v=" + Date.now());
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      songs = rowsToSongs(parseCSV(await res.text()));
      if (!songs.length) throw new Error("Die CSV enthält keine gültigen Songs.");
      deck = shuffleArray(songs);
      pos = 0;
      $("controls").classList.remove("hidden");
      renderCard();
    } catch (err) {
      const local = location.protocol === "file:";
      showMessage(`
        <h2>Songs konnten nicht geladen werden</h2>
        <p>${esc(String(err.message || err))}</p>
        ${local ? `<p>Die Seite wurde direkt als Datei geöffnet. Browser blockieren dabei das Laden von <code>${CSV_FILE}</code>. Bitte über GitHub Pages (oder einen lokalen Server) öffnen.</p>` : `<p>Liegt <code>${CSV_FILE}</code> im selben Ordner wie die <code>index.html</code>?</p>`}
      `);
    }
  }
  init();
</script>
</body>
</html>
