<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12121a">
<title>Hitster</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  :root {
    --bg: #12121a;
    --text: #f4f4f8;
    --muted: #9a9ab0;
    --btn: #23233a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  header {
    width: 100%;
    max-width: 480px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 0 6px;
  }
  header h1 { font-size: 1.3rem; margin: 0; letter-spacing: .08em; text-transform: uppercase; }
  #counter { color: var(--muted); font-variant-numeric: tabular-nums; font-size: .95rem; }

  #stage {
    flex: 1;
    width: 100%;
    max-width: 480px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    padding: 8px 0;
    touch-action: pan-y;
  }
  .card {
    --hue: 280;
    width: min(100%, calc((100vh - 220px) * 1), 420px);
    aspect-ratio: 1 / 1;
    perspective: 1400px;
    cursor: pointer;
    outline: none;
  }
  @supports (height: 100dvh) {
    .card { width: min(100%, calc(100dvh - 220px), 420px); }
  }
  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform .6s cubic-bezier(.4, .2, .2, 1);
  }
  .card.flipped .card-inner { transform: rotateY(180deg); }
  .face {
    position: absolute;
    inset: 0;
    border-radius: 22px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    box-shadow: 0 14px 40px rgba(0,0,0,.5);
    overflow: hidden;
  }
  .front {
    background: linear-gradient(145deg, hsl(var(--hue) 70% 48%), hsl(calc(var(--hue) + 40) 75% 32%));
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .qr-box {
    width: 68%;
    aspect-ratio: 1;
    background: #fff;
    border-radius: 16px;
    padding: 5%;
    display: flex;
  }
  .qr-box svg { width: 100%; height: 100%; display: block; }
  .front .hint {
    position: absolute;
    bottom: 5%;
    left: 0; right: 0;
    text-align: center;
    font-size: .8rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    opacity: .75;
  }
  .back {
    transform: rotateY(180deg);
    background: linear-gradient(145deg, hsl(calc(var(--hue) + 40) 75% 40%), hsl(var(--hue) 70% 28%));
    display: grid;
    grid-template-rows: 1fr auto 1fr;
    align-items: center;
    text-align: center;
    padding: 6%;
  }
  .artist { font-size: clamp(1.1rem, 5.5vw, 1.7rem); font-weight: 700; align-self: start; line-height: 1.2; }
  .year { font-size: clamp(4rem, 24vw, 7.5rem); font-weight: 800; line-height: 1; letter-spacing: -.02em; }
  .title { font-size: clamp(1rem, 5vw, 1.5rem); font-style: italic; align-self: end; line-height: 1.25; opacity: .95; }

  #controls {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 4px 0 14px;
  }
  .row { display: flex; gap: 10px; }
  button, a.btn {
    flex: 1;
    background: var(--btn);
    color: var(--text);
    border: 0;
    border-radius: 14px;
    padding: 14px 10px;
    font-size: 1rem;
    font-weight: 600;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
    font-family: inherit;
  }
  button.primary { background: #1db954; color: #04130a; flex: 2; }
  button:active, a.btn:active { transform: scale(.97); }
  button:disabled { opacity: .4; cursor: default; }
  .small { padding: 10px; font-size: .9rem; font-weight: 500; color: var(--muted); }

  #message {
    margin: auto;
    padding: 24px;
    text-align: center;
    max-width: 380px;
    line-height: 1.5;
  }
  #message h2 { margin-top: 0; }
  #message code { background: var(--btn); padding: 2px 6px; border-radius: 6px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <header>
    <h1>Hitster</h1>
    <span id="counter"></span>
  </header>

  <div id="stage"></div>

  <div id="message" class="hidden"></div>

  <div id="controls" class="hidden">
    <div class="row">
      <button id="prev" aria-label="Vorherige Karte">←</button>
      <button id="next" class="primary">Nächste Karte</button>
    </div>
    <div class="row">
      <a id="open" class="btn small" target="_blank" rel="noopener">In Spotify öffnen</a>
      <button id="shuffle" class="small">Neu mischen</button>
    </div>
  </div>

<script>
  const CSV_FILE = "songs.csv";

  let songs = [];
  let deck = [];
  let pos = 0;
  let cardEl = null;
  let busy = false;

  const $ = (id) => document.getElementById(id);

  // ---------- CSV ----------
  function parseCSV(text) {
    text = text.replace(/^\uFEFF/, "");
    const firstLine = text.split(/\r?\n/, 1)[0] || "";
    const delim = (firstLine.match(/;/g) || []).length >= (firstLine.match(/,/g) || []).length ? ";" : ",";
    const rows = [];
    let row = [], cell = "", inQ = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQ) {
        if (c === '"') {
          if (text[i + 1] === '"') { cell += '"'; i++; } else inQ = false;
        } else cell += c;
      } else if (c === '"') inQ = true;
      else if (c === delim) { row.push(cell); cell = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(cell); cell = "";
        if (row.some((x) => x.trim() !== "")) rows.push(row);
        row = [];
      } else cell += c;
    }
    row.push(cell);
    if (row.some((x) => x.trim() !== "")) rows.push(row);
    return rows;
  }

  function rowsToSongs(rows) {
    if (!rows.length) return [];
    const head = rows[0].map((h) => h.trim().toLowerCase());
    const find = (...names) => head.findIndex((h) => names.includes(h));
    const iA = find("interpret", "artist", "band");
    const iT = find("titel", "title", "song");
    const iY = find("jahr", "year");
    const iL = find("spotify_link", "link", "spotify", "url");
    if ([iA, iT, iY, iL].includes(-1)) {
      throw new Error("Kopfzeile der CSV muss lauten: interpret;titel;jahr;spotify_link");
    }
    return rows.slice(1).map((r) => ({
      artist: (r[iA] || "").trim(),
      title: (r[iT] || "").trim(),
      year: (r[iY] || "").trim(),
      link: (r[iL] || "").trim(),
    })).filter((s) => s.link && s.title);
  }

  // ---------- Deck ----------
  function shuffleArray(a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function hueFor(s) {
    let h = 0;
    const str = s.artist + s.title;
    for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 360;
    return h;
  }

  // ---------- QR ----------
  function qrSvg(text) {
    const qr = qrcode(0, "M");
    qr.addData(text);
    qr.make();
    const n = qr.getModuleCount();
    let path = "";
    for (let r = 0; r < n; r++) {
      for (let c = 0; c < n; c++) {
        if (qr.isDark(r, c)) path += `M${c} ${r}h1v1h-1z`;
      }
    }
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges"><path d="${path}" fill="#000"/></svg>`;
  }

  // ---------- Render ----------
  function esc(s) {
    return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function renderCard() {
    const s = deck[pos];
    $("stage").innerHTML = `
      <div class="card" style="--hue:${hueFor(s)}" tabindex="0" role="button" aria-label="Karte umdrehen">
        <div class="card-inner">
          <div class="face front">
            <div class="qr-box">${qrSvg(s.link)}</div>
            <div class="hint">Scannen · Tippen zum Umdrehen</div>
          </div>
          <div class="face back">
            <div class="artist">${esc(s.artist)}</div>
            <div class="year">${esc(s.year)}</div>
            <div class="title">${esc(s.title)}</div>
          </div>
        </div>
      </div>`;
    cardEl = $("stage").querySelector(".card");
    cardEl.addEventListener("click", flip);
    cardEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); }
    });
    $("open").href = s.link;
    $("counter").textContent = `${pos + 1} / ${deck.length}`;
    $("prev").disabled = pos === 0;
    $("next").textContent = pos === deck.length - 1 ? "Neu mischen" : "Nächste Karte";
  }

  function flip() {
    if (cardEl) cardEl.classList.toggle("flipped");
  }

  function go(delta) {
    if (busy) return;
    const target = pos + delta;
    if (target < 0) return;
    if (target >= deck.length) { reshuffle(); return; }
    busy = true;
    const wasFlipped = cardEl && cardEl.classList.contains("flipped");
    if (wasFlipped) cardEl.classList.remove("flipped");
    setTimeout(() => {
      pos = target;
      renderCard();
      busy = false;
    }, wasFlipped ? 350 : 0);
  }

  function reshuffle() {
    busy = true;
    const wasFlipped = cardEl && cardEl.classList.contains("flipped");
    if (wasFlipped) cardEl.classList.remove("flipped");
    setTimeout(() => {
      deck = shuffleArray(songs);
      pos = 0;
      renderCard();
      busy = false;
    }, wasFlipped ? 350 : 0);
  }

  // ---------- Events ----------
  $("next").addEventListener("click", () => go(1));
  $("prev").addEventListener("click", () => go(-1));
  $("shuffle").addEventListener("click", reshuffle);

  document.addEventListener("keydown", (e) => {
    if (!deck.length) return;
    if (e.key === "ArrowRight") go(1);
    else if (e.key === "ArrowLeft") go(-1);
    else if (e.key === " " && e.target === document.body) { e.preventDefault(); flip(); }
  });

  let sx = 0, sy = 0, swiped = false;
  const stage = $("stage");
  stage.addEventListener("touchstart", (e) => {
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; swiped = false;
  }, { passive: true });
  stage.addEventListener("touchend", (e) => {
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      swiped = true;
      go(dx < 0 ? 1 : -1);
    }
  }, { passive: true });
  // Wischen soll die Karte nicht zusätzlich umdrehen
  stage.addEventListener("click", (e) => {
    if (swiped) { e.stopPropagation(); e.preventDefault(); swiped = false; }
  }, true);

  // ---------- Start ----------
  function showMessage(html) {
    $("stage").classList.add("hidden");
    $("controls").classList.add("hidden");
    $("message").classList.remove("hidden");
    $("message").innerHTML = html;
  }

  async function init() {
    try {
      const res = await fetch(CSV_FILE + "?v=" + Date.now());
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      songs = rowsToSongs(parseCSV(await res.text()));
      if (!songs.length) throw new Error("Die CSV enthält keine gültigen Songs.");
      deck = shuffleArray(songs);
      pos = 0;
      $("controls").classList.remove("hidden");
      renderCard();
    } catch (err) {
      const local = location.protocol === "file:";
      showMessage(`
        <h2>Songs konnten nicht geladen werden</h2>
        <p>${esc(String(err.message || err))}</p>
        ${local ? `<p>Die Seite wurde direkt als Datei geöffnet. Browser blockieren dabei das Laden von <code>${CSV_FILE}</code>. Bitte über GitHub Pages (oder einen lokalen Server) öffnen.</p>` : `<p>Liegt <code>${CSV_FILE}</code> im selben Ordner wie die <code>index.html</code>?</p>`}
      `);
    }
  }
  init();
</script>
</body>
</html>
